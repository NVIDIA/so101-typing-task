<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
<title id="title">Measure height relative to the plastic base underside</title>
<desc id="desc">Side schematic with a raised base. Measure base underside and keycap rim heights from the same level reference, then subtract. The clamp and table do not define the robot origin.</desc>
<rect width="1000" height="390" fill="#f8fafc"/>
<style>text{font-family:Arial,sans-serif;fill:#172c42;font-size:17px}.small{font-size:14px}</style>
<text x="35" y="35" font-size="23" font-weight="bold">Height datum | side schematic, not to scale</text>
<line x1="40" y1="275" x2="955" y2="275" stroke="#456881" stroke-width="3"/>
<text x="50" y="305">Common level reference (e.g. table)</text>
<rect x="145" y="135" width="180" height="80" rx="5" fill="#c6d9e8" stroke="#456881"/>
<text x="160" y="162">Plastic base</text>
<rect x="145" y="215" width="180" height="60" fill="#e8e2d9" stroke="#9c8f7a"/>
<text x="153" y="242" class="small">Mount / clamp plate</text>
<text x="153" y="261" class="small">(if present)</text>
<line x1="325" y1="215" x2="935" y2="215" stroke="#0c8060" stroke-width="1.5" stroke-dasharray="6 4"/>
<circle cx="325" cy="215" r="4" fill="#0c8060"/>
<text x="344" y="240" fill="#0c8060">D: underside plane</text>
<rect x="660" y="247" width="200" height="28" fill="#e8e2d9" stroke="#9c8f7a"/>
<rect x="635" y="195" width="250" height="52" rx="6" fill="#dce4ec" stroke="#456881"/>
<path d="M660 195 L665 169 L685 169 Q710 184 735 169 L755 169 L760 195Z" fill="white" stroke="#456881"/>
<line x1="660" y1="169" x2="790" y2="169" stroke="#0c8060" stroke-dasharray="4 3"/>
<circle cx="710" cy="169" r="4" fill="#0c8060"/>
<text x="620" y="112">Keycap rim centre</text>
<text x="620" y="135" class="small">Bridge the rim; do not measure the bowl.</text>
<line x1="710" y1="145" x2="710" y2="162" stroke="#0c8060"/>
<path d="M100 215 H125 M112 215 V275 M100 275 H125" fill="none" stroke="#99450d" stroke-width="2"/>
<text x="45" y="208" class="small">H_base</text>
<path d="M912 169 H937 M925 169 V275 M912 275 H937" fill="none" stroke="#99450d" stroke-width="2"/>
<text x="890" y="154" class="small">H_key</text>
<path d="M796 169 H814 M805 169 V215 M796 215 H814" fill="none" stroke="#0c8060" stroke-width="2"/>
<text x="817" y="188">Z</text>
<text x="35" y="348" font-weight="bold">Enter Z = H_key − H_base, in mm. Measure Q, P and Z separately.</text>
<text x="35" y="375">If the base underside is flush on the reference table, H_base = 0. Z can be negative.</text>
</svg>
